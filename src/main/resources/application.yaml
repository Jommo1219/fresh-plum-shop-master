spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/fresh_plum_shop?serverTimezone=GMT%2B8&useUnicode=true&useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 1
      max-active: 20
      max-wait: 5000
      filters: stat.log4j.wall
      validation-query: SELECT 'x'
      enable: true
  data:
    #redis配置
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          #最大连接数
          max-active: 8
          #最大阻塞等待时间（负数表示没限制）
          max-wait: -1ms
          #最大空闲
          max-idle: 8
          #最小空闲
          min-idle: 0
      timeout: 10000
  #jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 热部署
  devtools:
    restart:
      enabled: true
  # 设置单文件最大容量
  servlet:
    multipart:
      max-file-size: 10MB
#mybatis-plus配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted # 全局逻辑删除字段名
      logic-delete-value: 1 # 逻辑已删除值
      logic-not-delete-value: 0 # 逻辑未删除值
      id-type: assign_id # ID生成规则
      schema: fresh_plum_shop
    banner: false # 是否打印Mybatis-Plus的LOGO
  configuration:
    #数据库下划线自动转驼峰
    map-underscore-to-camel-case: true
    #日志配置
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.jommo.domain